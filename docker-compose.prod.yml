services:
  prometheus:
    ports: !override []

  grafana:
    ports: !override []

  api:
    ports: !override []

  frontend:
    ports: !override []
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  edge:
    profiles: ["legacy-edge"]
    ports: !override []

  trading:
    profiles: ["trading"]

  caddy:
    image: caddy:2.10-alpine
    restart: always
    environment:
      ALGOSPHERE_DOMAIN: ${ALGOSPHERE_DOMAIN:?Set ALGOSPHERE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
