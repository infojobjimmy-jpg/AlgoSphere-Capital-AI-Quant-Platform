apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaios-api
  namespace: gaios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaios-api
  template:
    metadata:
      labels:
        app: gaios-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/gaios-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gaios-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaios-ingestion
  namespace: gaios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaios-ingestion
  template:
    metadata:
      labels:
        app: gaios-ingestion
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/example/gaios-api:latest
          command: ["python", "-m", "app.workers.ingestion_runner"]
          envFrom:
            - configMapRef:
                name: gaios-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaios-bridge
  namespace: gaios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaios-bridge
  template:
    metadata:
      labels:
        app: gaios-bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/example/gaios-api:latest
          command: ["python", "-m", "app.workers.kafka_bridge"]
          envFrom:
            - configMapRef:
                name: gaios-config
