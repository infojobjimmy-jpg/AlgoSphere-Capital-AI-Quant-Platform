# Edge reverse proxy — TLS via Let's Encrypt: mount host certs to /etc/nginx/ssl
# (fullchain.pem + privkey.pem) and add a second server block listening on 443, or use certbot companion.
#
# Optional basic auth: create htpasswd file and mount at /etc/nginx/.htpasswd, then uncomment the
# two auth_basic lines in both location / blocks below.
#
# Optional IP allowlist: replace "allow all" with e.g. allow 203.0.113.0/24; deny all;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream ac_frontend {
  server frontend:80;
  keepalive 16;
}

upstream ac_api {
  server api:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # ACME HTTP-01 (Certbot) — /.well-known must reach certbot container or host
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location /api/ {
    # auth_basic "Algosphere";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://ac_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /ws/ {
    # auth_basic "Algosphere";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://ac_api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    # auth_basic "Algosphere";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://ac_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
