services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    restart: always
    networks:
      - backend
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - KA
      - --protected-mode
      - "no"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    networks:
      - backend
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=replica
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: gaios
      POSTGRES_PASSWORD: gaios
      POSTGRES_DB: gaios
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/sql/algosphere_trading.sql:/docker-entrypoint-initdb.d/02-trading.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaios -d gaios -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.6.3
    restart: always
    networks:
      - backend
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 8

  grafana-provision:
    image: busybox:1.36
    networks:
      - backend
    volumes:
      - grafana_provisioning:/provision
    command:
      - sh
      - -c
      - |
        mkdir -p /provision/datasources
        printf '%s\n' 'apiVersion: 1' 'datasources:' '  - name: Prometheus' '    type: prometheus' '    access: proxy' '    url: http://prometheus:9090' '    isDefault: true' '    editable: false' > /provision/datasources/prometheus.yaml
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: always
    networks:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    networks:
      - backend
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_provisioning:/etc/grafana/provisioning:ro
    depends_on:
      grafana-provision:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gaios:gaios@db:5432/gaios
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      WEBCAM_REGISTRY_PATH: /app/config/webcams.example.json
      WS_COMPRESS_SNAPSHOTS: "false"
      PUBLIC_GEOSPATIAL_MODE: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/system/health\", timeout=5).read()"',
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.workers.ingestion_runner
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gaios:gaios@db:5432/gaios
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      WEBCAM_REGISTRY_PATH: /app/config/webcams.example.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  camera-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.workers.camera_worker
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://gaios:gaios@db:5432/gaios
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      WEBCAM_REGISTRY_PATH: /app/config/webcams.example.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  bridge:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.workers.kafka_bridge
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://gaios:gaios@db:5432/gaios
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  cortex:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.agents.cortex_agent
    env_file:
      - ./backend/.env.example
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  trading:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.agents.trading_agent
    env_file:
      - ./backend/.env.example
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  observer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    networks:
      - backend
    command: python -m app.agents.observer_agent
    env_file:
      - ./backend/.env.example
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN:-}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_LIVE_WS_COMPRESS: ${VITE_LIVE_WS_COMPRESS:-false}
    restart: always
    networks:
      - backend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  edge:
    image: nginx:1.27-alpine
    restart: always
    networks:
      - backend
    ports:
      - "9080:80"
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4

networks:
  backend:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  timescale_data:
  chroma_data:
  grafana_data:
  grafana_provisioning:
