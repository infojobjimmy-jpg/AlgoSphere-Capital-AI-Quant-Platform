apiVersion: v1
kind: Service
metadata:
  name: gaios-api
  namespace: gaios
spec:
  selector:
    app: gaios-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gaios-api
  namespace: gaios
spec:
  rules:
    - host: gaios.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gaios-api
                port:
                  number: 8080
