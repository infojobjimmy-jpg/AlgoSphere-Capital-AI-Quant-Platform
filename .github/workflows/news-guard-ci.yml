name: News Guard CI

on:
  push:
    branches:
      - codex/live-geospatial-sources-restoration
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/n8n/algosphere-news-guard.json"
      - "infra/scripts/news-guard-preflight.ps1"
      - "infra/scripts/deploy-news-guard.ps1"
      - ".github/workflows/news-guard-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -q tests/test_news_guard.py tests/test_news_guard_fail_safe.py tests/test_news_guard_router.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  n8n-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool infra/n8n/algosphere-news-guard.json > /dev/null

  powershell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse News Guard PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "infra/scripts/news-guard-preflight.ps1",
            "infra/scripts/deploy-news-guard.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
